# German texts of the forms for visitors addressed formally ("Sie"), only
# those that differ from de.yaml (decision 0316).
"Thank you, your message has been sent.": "Danke, Ihre Nachricht wurde gesendet."
"The form could not be sent. Please check your entries and try again.": "Das Formular konnte nicht gesendet werden. Bitte prüfen Sie Ihre Angaben und versuchen Sie es noch einmal."
"Please choose at least one.": "Bitte wählen Sie mindestens eins aus."
"Please agree to send the form.": "Bitte stimmen Sie zu, um das Formular zu senden."
"Please check this box.": "Bitte setzen Sie diesen Haken."
"Please fill in this field.": "Bitte füllen Sie dieses Feld aus."
"Please write at most {count} characters.": "Bitte schreiben Sie höchstens {count} Zeichen."
"Please enter an email address, e.g. name@example.com.": "Bitte geben Sie eine E-Mail-Adresse ein, z. B. name@example.com."
"Please enter a phone number.": "Bitte geben Sie eine Telefonnummer ein."
"Please enter a number.": "Bitte geben Sie eine Zahl ein."
"Please enter a date.": "Bitte geben Sie ein Datum ein."
"Please choose one of the options.": "Bitte wählen Sie eine der Möglichkeiten."
"You have sent this form several times. Try again in a minute.": "Sie haben dieses Formular mehrmals gesendet. Bitte versuchen Sie es in einer Minute noch einmal."
"You have sent this form several times. Try again in {minutes} minutes.": "Sie haben dieses Formular mehrmals gesendet. Bitte versuchen Sie es in {minutes} Minuten noch einmal."
"Please choose a file.": "Bitte wählen Sie eine Datei aus."
"Please choose at most {count} files.": "Bitte wählen Sie höchstens {count} Dateien aus."
"Please choose PDF, Word, OpenDocument or text documents or images (JPEG, PNG, WebP).": "Bitte wählen Sie PDF-, Word-, OpenDocument- oder Textdokumente oder Bilder (JPEG, PNG, WebP)."
"Please solve the sum.": "Bitte rechnen Sie die Aufgabe aus."
"The result is not right. Please try again.": "Das Ergebnis stimmt nicht. Bitte versuchen Sie es noch einmal."
