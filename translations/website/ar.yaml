# Arabic texts of the forms for visitors (decisions 0161, 0222).
"Send": "إرسال"
"Thank you, your message has been sent.": "شكرًا لك، تم إرسال رسالتك."
"The form could not be sent. Please check your entries and try again.": "تعذّر إرسال النموذج. يُرجى مراجعة بياناتك والمحاولة مرة أخرى."
"Fields marked with * are required.": "الحقول المعلَّمة بـ * إلزامية."
"Please choose": "يُرجى الاختيار"
"Please choose at least one.": "يُرجى اختيار خيار واحد على الأقل."
"Please agree to send the form.": "يُرجى الموافقة لإرسال النموذج."
"Please check this box.": "يُرجى تحديد هذا المربع."
"Please fill in this field.": "يُرجى ملء هذا الحقل."
"Please write at most {count} characters.": "يُرجى كتابة {count} حرفًا على الأكثر."
"Please enter an email address, e.g. name@example.com.": "يُرجى إدخال عنوان بريد إلكتروني، مثل name@example.com."
"Please enter a phone number.": "يُرجى إدخال رقم هاتف."
"Please enter a number.": "يُرجى إدخال رقم."
"Please enter a date.": "يُرجى إدخال تاريخ."
"Please choose one of the options.": "يُرجى اختيار أحد الخيارات."
"You have sent this form several times. Try again in a minute.": "لقد أرسلت هذا النموذج عدة مرات. حاول مرة أخرى بعد دقيقة."
"You have sent this form several times. Try again in {minutes} minutes.": "لقد أرسلت هذا النموذج عدة مرات. حاول مرة أخرى بعد {minutes} دقائق."
"The form is not online.": "النموذج غير متاح."
