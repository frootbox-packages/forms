# German texts of the forms: labels of the block, texts for visitors and the screens (decision 0222).
"Forms": "Formulare"
"Forms built from field types, entries by mail and in the backend, spam protection with captchas of your choice and a spam folder": "Formulare aus Feldtypen, Einsendungen per Mail und im Backend, Spam-Schutz mit wählbarem Captcha und Spam-Ordner"
"Form": "Formular"
"A form from the backend, e.g. for contact or registration. Entries arrive by mail and stay in the backend.": "Ein Formular aus dem Backend, z. B. für Kontakt oder Anmeldung. Einsendungen kommen per Mail und bleiben im Backend."
# Website
"Send": "Senden"
"Thank you, your message has been sent.": "Danke, Deine Nachricht wurde gesendet."
"The form could not be sent. Please check your entries and try again.": "Das Formular konnte nicht gesendet werden. Bitte prüfe Deine Angaben und versuche es noch einmal."
"Fields marked with * are required.": "Mit * markierte Felder sind Pflicht."
"Please choose": "Bitte wählen"
"Please choose at least one.": "Bitte wähle mindestens eins aus."
"Please agree to send the form.": "Bitte stimme zu, um das Formular zu senden."
"Please check this box.": "Bitte setze diesen Haken."
"Please fill in this field.": "Bitte fülle dieses Feld aus."
"Please write at most {count} characters.": "Bitte schreib höchstens {count} Zeichen."
"Please enter an email address, e.g. name@example.com.": "Bitte gib eine E-Mail-Adresse ein, z. B. name@example.com."
"Please enter a phone number.": "Bitte gib eine Telefonnummer ein."
"Please enter a number.": "Bitte gib eine Zahl ein."
"Please enter a date.": "Bitte gib ein Datum ein."
"Please choose one of the options.": "Bitte wähle eine der Möglichkeiten."
"You have sent this form several times. Try again in a minute.": "Du hast dieses Formular mehrmals gesendet. Versuch es in einer Minute noch einmal."
"You have sent this form several times. Try again in {minutes} minutes.": "Du hast dieses Formular mehrmals gesendet. Versuch es in {minutes} Minuten noch einmal."
"Choose a published form in the options of this block.": "Wähl in den Optionen dieses Blocks ein veröffentlichtes Formular."
"The form is not online.": "Das Formular ist nicht online."
# Mail
"New entry: {form}": "Neue Einsendung: {form}"
"yes": "ja"
"no": "nein"
# Settings
"Entries of the forms on the website and their protection against spam": "Einsendungen der Formulare auf der Website und ihr Schutz vor Spam"
"Keep entries": "Einsendungen aufbewahren"
"Days an entry stays in the backend before it is deleted; 0 keeps them until someone deletes them.": "Tage, die eine Einsendung im Backend bleibt, bevor sie gelöscht wird; 0 behält sie, bis jemand sie löscht."
# Field types
"Number": "Zahl"
"Long text": "Langer Text"
"Drop-down list": "Auswahlliste"
"One of several": "Eins von mehreren"
"Several of several": "Mehrere von mehreren"
"Checkbox": "Haken"
"Consent": "Zustimmung"
# Backend
"New form": "Neues Formular"
"Forms for the website, e.g. for contact or registration. The block \"Form\" shows them on a page.": "Formulare für die Website, z. B. für Kontakt oder Anmeldung. Der Block „Formular“ zeigt sie auf einer Seite."
"No forms yet": "Noch keine Formulare"
"Build the first one. It stays a draft until you publish it.": "Bau das erste. Es bleibt ein Entwurf, bis Du es veröffentlichst."
"{count} field": { one: "{count} Feld", other: "{count} Felder" }
"{count} entry": { one: "{count} Einsendung", other: "{count} Einsendungen" }
"The form is saved as a draft. Now add its fields.": "Das Formular ist als Entwurf gespeichert. Füg jetzt seine Felder hinzu."
"Shown above the form, e.g. \"Contact\".": "Steht über dem Formular, z. B. „Kontakt“."
"Email addresses that get every entry, one per line. Without, the entries are only kept here.": "E-Mail-Adressen, die jede Einsendung bekommen, eine pro Zeile. Ohne bleiben die Einsendungen nur hier."
"The form is published.": "Das Formular ist veröffentlicht."
"Text of the button": "Text des Knopfs"
"Empty for \"Send\".": "Leer für „Senden“."
"Text after sending": "Text nach dem Senden"
"Empty for a general thanks.": "Leer für einen allgemeinen Dank."
"Visitors in this language see the form in the first language.": "Besucher in dieser Sprache sehen das Formular in der ersten Sprache."
"Add a field": "Feld hinzufügen"
"No fields yet": "Noch keine Felder"
"Add the fields visitors fill in, e.g. name, email and message.": "Füg die Felder hinzu, die Besucher ausfüllen, z. B. Name, E-Mail und Nachricht."
"Without a label": "Ohne Beschriftung"
"Required": "Pflicht"
"Move {name} up": "{name} nach oben"
"Move {name} down": "{name} nach unten"
"Moved": "Verschoben"
"Edit {name}": "{name} bearbeiten"
"Recipients": "Empfänger"
"Email addresses": "E-Mail-Adressen"
"They get every entry, one address per line. Without, the entries are only kept here.": "Sie bekommen jede Einsendung, eine Adresse pro Zeile. Ohne bleiben die Einsendungen nur hier."
"Delete the form": "Formular löschen"
"What visitors fill in, in this order.": "Was Besucher ausfüllen, in dieser Reihenfolge."
"The field is added.": "Das Feld ist hinzugefügt."
"Edit the field": "Feld bearbeiten"
"Type": "Typ"
"Label": "Beschriftung"
"Hint": "Hinweis"
"A short help below the field.": "Eine kurze Hilfe unter dem Feld."
"Only for a drop-down list, one of several and several of several: one option per line.": "Nur für Auswahlliste, Eins von mehreren und Mehrere von mehreren: eine Möglichkeit pro Zeile."
"Visitors must fill it in. Consent is always required.": "Besucher müssen es ausfüllen. Zustimmung ist immer Pflicht."
"Add": "Hinzufügen"
"The field is removed.": "Das Feld ist entfernt."
"Remove the field?": "Feld entfernen?"
"Visitors no longer see it once you publish. Entries sent before keep its value.": "Besucher sehen es nicht mehr, sobald Du veröffentlichst. Frühere Einsendungen behalten seinen Wert."
"Your changes to this form are lost. The published version stays.": "Deine Änderungen an diesem Formular gehen verloren. Die veröffentlichte Fassung bleibt."
"The form was never published and is gone afterwards.": "Das Formular war nie veröffentlicht und ist danach weg."
"The form is deleted.": "Das Formular ist gelöscht."
"The form and its entry are deleted. Pages that show it show nothing in its place.": { one: "Das Formular und seine Einsendung werden gelöscht. Seiten, die es zeigen, zeigen an seiner Stelle nichts.", other: "Das Formular und seine {count} Einsendungen werden gelöscht. Seiten, die es zeigen, zeigen an seiner Stelle nichts." }
"Entries": "Einsendungen"
"Entries are deleted after one day.": { one: "Einsendungen werden nach einem Tag gelöscht.", other: "Einsendungen werden nach {count} Tagen gelöscht." }
"Entries stay until you delete them.": "Einsendungen bleiben, bis Du sie löschst."
"Export as CSV": "Als CSV exportieren"
"No entries yet": "Noch keine Einsendungen"
"What visitors send with this form appears here.": "Was Besucher mit diesem Formular senden, erscheint hier."
"Delete the entry": "Einsendung löschen"
"The entry is deleted.": "Die Einsendung ist gelöscht."
"Delete the entry?": "Einsendung löschen?"
"What the visitor sent is gone afterwards. Mails sent already stay with their recipients.": "Was der Besucher gesendet hat, ist danach weg. Schon verschickte Mails bleiben bei ihren Empfängern."
"Sent": "Gesendet"
# Errors of the actions
"\"{address}\" is no email address.": "„{address}“ ist keine E-Mail-Adresse."
"may have at most {count} addresses.": "darf höchstens {count} Adressen haben."
"must be a list of texts, e.g. [\"Coffee\", \"Tea\"].": "muss eine Liste von Texten sein, z. B. [\"Kaffee\", \"Tee\"]."
"must be a text of at most {count} characters.": "muss ein Text mit höchstens {count} Zeichen sein."
"may have at most {count} options.": "darf höchstens {count} Möglichkeiten haben."
"A form has at most {count} fields.": "Ein Formular hat höchstens {count} Felder."
"The form has no field \"{key}\".": "Das Formular hat kein Feld „{key}“."
"needs at least one language with a title.": "braucht mindestens eine Sprache mit Titel."
"A form needs at least one field.": "Ein Formular braucht mindestens ein Feld."
"The field \"{key}\" needs a label in {language}.": "Das Feld „{key}“ braucht eine Beschriftung in {language}."
"The field \"{key}\" needs options in {language}.": "Das Feld „{key}“ braucht Möglichkeiten in {language}."
"The website has no language \"{language}\".": "Die Website hat keine Sprache „{language}“."
"must be an object or null.": "muss ein Objekt oder null sein."
"must be a text.": "muss ein Text sein."
"may have at most {count} characters.": "darf höchstens {count} Zeichen haben."
"must start with a small letter and have only letters and digits, e.g. \"email\" or \"phoneNumber\".": "muss mit einem Kleinbuchstaben beginnen und darf nur Buchstaben und Ziffern haben, z. B. „email“ oder „phoneNumber“."
"The form has a field \"{key}\" already.": "Das Formular hat schon ein Feld „{key}“."
# Files in forms (decision 0230)
"Files": "Dateien"
"Please choose a file.": "Bitte wähle eine Datei aus."
"Please choose at most {count} files.": "Bitte wähle höchstens {count} Dateien aus."
"A file could not be received. Each may have at most {max} MB.": "Eine Datei kam nicht an. Jede darf höchstens {max} MB groß sein."
"Please choose PDF, Word, OpenDocument or text documents or images (JPEG, PNG, WebP).": "Bitte wähle PDF-, Word-, OpenDocument- oder Textdokumente oder Bilder (JPEG, PNG, WebP)."
"The file {name} is too large, at most {max} MB.": "Die Datei {name} ist zu groß, höchstens {max} MB."
"The files are too large together, at most {max} MB.": "Die Dateien sind zusammen zu groß, höchstens {max} MB."
"PDF, Word, OpenDocument, text or images, up to {count} files of at most {max} MB each.": "PDF, Word, OpenDocument, Text oder Bilder, bis zu {count} Dateien mit je höchstens {max} MB."
"The files are with the entry in the backend.": "Die Dateien liegen bei der Einsendung im Backend."
"Regarding": "Betrifft"
"New entry: {form} – {about}": "Neue Einsendung: {form} – {about}"
"Link": "Link"
"No link": "Kein Link"
"Only for consent, e.g. the privacy policy. Put the text of the link in [square brackets] in the label, else the link follows the label.": "Nur für die Zustimmung, z. B. die Datenschutzerklärung. Setz den Text des Links in der Beschriftung in [eckige Klammern], sonst folgt der Link der Beschriftung."
"Privacy policy": "Datenschutzerklärung"
"Only a consent field has a link.": "Nur ein Feld für die Zustimmung hat einen Link."
"must be a page such as \"page:01J…\" or an address such as \"https://example.org/privacy\".": "muss eine Seite wie „page:01J…“ oder eine Adresse wie „https://example.org/privacy“ sein."
# Spam protection (decision 0261)
"What is {first} plus {second}?": "Wie viel ist {first} plus {second}?"
"This keeps the form free of spam.": "Das hält das Formular frei von Spam."
"Please solve the sum.": "Bitte rechne die Aufgabe aus."
"The result is not right. Please try again.": "Das Ergebnis stimmt nicht. Bitte versuch es noch einmal."
"The captcha is not solved.": "Das Captcha ist nicht gelöst."
"Spam protection": "Spam-Schutz"
"There is no such captcha.": "Dieses Captcha gibt es nicht."
"Captcha": "Captcha"
"The captcha of forms that choose none of their own: frootbox/forms/proof-of-work (invisible), frootbox/forms/math (a sum to solve), the name of one from another extension or none.": "Das Captcha der Formulare, die keins selbst wählen: frootbox/forms/proof-of-work (unsichtbar), frootbox/forms/math (Rechenaufgabe), der Name eines Captchas aus einer anderen Extension oder none."
"Links in an entry": "Links in einer Einsendung"
"An entry with more links goes to the spam folder.": "Eine Einsendung mit mehr Links landet im Spam-Ordner."
"Words of spam": "Spam-Wörter"
"An entry with one of these words goes to the spam folder, separated by commas, e.g. \"casino, crypto\".": "Eine Einsendung mit einem dieser Wörter landet im Spam-Ordner, durch Komma getrennt, z. B. „Casino, Krypto“."
"Proof of work": "Rechenbeweis"
"Invisible: the browser of the visitor solves a task for a moment. Without JavaScript an entry goes to the spam folder.": "Unsichtbar: Der Browser des Besuchers löst kurz eine Aufgabe. Ohne JavaScript landet eine Einsendung im Spam-Ordner."
"Sum to solve": "Rechenaufgabe"
"Visitors solve a small sum, also without JavaScript.": "Besucher rechnen eine kleine Aufgabe aus, auch ohne JavaScript."
"A hidden field, the time it takes to fill in and a limit per address protect every form. A captcha adds to it. What looks like spam lands in the spam folder of the entries, without a mail.": "Jedes Formular schützen ein verstecktes Feld, die Zeit zum Ausfüllen und eine Grenze je Adresse. Ein Captcha kommt hinzu. Was nach Spam aussieht, landet ohne Mail im Spam-Ordner der Einsendungen."
"Standard of the website": "Standard der Website"
"Now: {captcha}. The settings of the forms decide.": "Zurzeit: {captcha}. Das legen die Einstellungen der Formulare fest."
"No captcha": "Kein Captcha"
"Only the hidden field, the time and the limit per address.": "Nur das versteckte Feld, die Zeit und die Grenze je Adresse."
"Folders": "Ordner"
"Inbox": "Eingang"
"Spam": "Spam"
"What looks like spam comes here without a mail. It is deleted after one day.": { one: "Was nach Spam aussieht, kommt ohne Mail hierher. Es wird nach einem Tag gelöscht.", other: "Was nach Spam aussieht, kommt ohne Mail hierher. Es wird nach {count} Tagen gelöscht." }
"No spam": "Kein Spam"
"What the spam protection holds back appears here.": "Was der Spam-Schutz zurückhält, erscheint hier."
"Why it looks like spam": "Warum es nach Spam aussieht"
"Not spam": "Kein Spam"
"Not spam?": "Kein Spam?"
"The entry moves to the inbox and goes to the recipients by mail now.": "Die Einsendung kommt in den Eingang und geht jetzt per Mail an die Empfänger."
"Move to the inbox": "In den Eingang"
"The entry is in the inbox.": "Die Einsendung ist im Eingang."
"The proof of work is missing.": "Der Rechenbeweis fehlt."
"The proof of work is wrong.": "Der Rechenbeweis stimmt nicht."
"The proof of work is out of date.": "Der Rechenbeweis ist abgelaufen."
"The proof of work was used before.": "Der Rechenbeweis wurde schon einmal benutzt."
"The task of the sum is missing.": "Die Rechenaufgabe fehlt."
"More links than the setting allows.": "Mehr Links, als die Einstellung erlaubt."
"A word of spam from the settings.": "Ein Spam-Wort aus den Einstellungen."
"Set up this captcha in the settings first.": "Richte dieses Captcha zuerst in den Einstellungen ein."
"Set it up in the settings of the extension first.": "Richte es zuerst in den Einstellungen der Extension ein."
